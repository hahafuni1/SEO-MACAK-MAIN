[build]
  command = "npm run build"
  publish = "dist"

# ─── Canonical host: apex → www (301 permanent) ──────────────────────────────
# Netlify also provides a dashboard toggle, but an explicit rule here ensures
# the redirect is always active regardless of dashboard settings.
[[redirects]]
  from  = "https://seomacak.com/*"
  to    = "https://www.seomacak.com/:splat"
  status = 301
  force  = true

# ─── True 404 for any unmatched route ────────────────────────────────────────
# Prerendered pages are served directly as static files; only unknown routes
# fall through to this rule. Status 404 (not 200) prevents soft-404 indexing.
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# ─── Security headers ────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://plausible.io https://api.emailjs.com; frame-ancestors 'none';"

# HTML pages: always revalidate (prerendered, so content changes on each deploy)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed assets: cache forever (Vite fingerprints these)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Explicit MIME types — kept from original to avoid Netlify MIME-type issues
# that were previously fixed (see git history "Fix Netlify MIME type and routing")
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
