<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left accent bar -->
  <rect x="72" y="72" width="4" height="486" fill="#FDCA40" rx="2"/>

  <!-- Top label -->
  <text x="100" y="130" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="700" letter-spacing="5" fill="#FDCA40"
        text-rendering="geometricPrecision">
    BEOGRAD · SRBIJA
  </text>

  <!-- Main brand name -->
  <text x="100" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="96" font-weight="800" fill="#ffffff"
        text-rendering="geometricPrecision">
    SEO
  </text>
  <text x="100" y="390" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="96" font-weight="800" fill="#FDCA40"
        text-rendering="geometricPrecision">
    MAČAK
  </text>

  <!-- Tagline -->
  <text x="100" y="460" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400" fill="#999999"
        text-rendering="geometricPrecision">
    SEO Optimizacija + Izrada Sajtova
  </text>

  <!-- Bottom URL -->
  <text x="100" y="540" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="16" font-weight="400" fill="#555555"
        text-rendering="geometricPrecision">
    seomacak.com
  </text>

  <!-- Decorative accent dot cluster (top right) -->
  <circle cx="1050" cy="140" r="120" fill="#FDCA40" opacity="0.04"/>
  <circle cx="1100" cy="200" r="60" fill="#FDCA40" opacity="0.06"/>
  <circle cx="1050" cy="140" r="3" fill="#FDCA40" opacity="0.6"/>
  <circle cx="1080" cy="170" r="2" fill="#FDCA40" opacity="0.4"/>
  <circle cx="1020" cy="110" r="2" fill="#FDCA40" opacity="0.4"/>

  <!-- Right column — stat blocks -->
  <rect x="820" y="280" width="310" height="1" fill="#333333"/>

  <text x="820" y="340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="48" font-weight="800" fill="#FDCA40"
        text-rendering="geometricPrecision">
    #1
  </text>
  <text x="820" y="368" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="400" fill="#777777"
        text-rendering="geometricPrecision">
    Google rangiranje
  </text>

  <rect x="820" y="400" width="310" height="1" fill="#333333"/>

  <text x="820" y="450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="48" font-weight="800" fill="#FDCA40"
        text-rendering="geometricPrecision">
    +200%
  </text>
  <text x="820" y="478" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="400" fill="#777777"
        text-rendering="geometricPrecision">
    organski trafik
  </text>

  <rect x="820" y="510" width="310" height="1" fill="#333333"/>
</svg>
